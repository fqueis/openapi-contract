# Publish @fqueis/openapi-contract to npm when a new version lands on main.
#
# Auth: npm Trusted Publishing (OIDC). Requires id-token: write,
# Node >= 22.14, npm CLI >= 11.5.1, and a Trusted Publisher on npmjs.com pointing
# at this workflow file (publish.yml) for repo fqueis/openapi-contract.
#
# Gate: skip if package.json version is already on the registry.
# Otherwise: lint + test + build, create GitHub Release, then pnpm publish.
# Release notes prefer the matching ## [version] section from CHANGELOG.md;
# otherwise fall back to gh --generate-notes from the previous v* tag (or an
# initial-release stub when no prior tag exists).
# workflow_dispatch retries a failed publish without a new bump.
#
# Bootstrap: the first package version must exist on npm (local publish + 2FA) before
# Trusted Publisher can be configured; after that, CI owns subsequent publishes.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Resolve version and check npm
        id: version
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

          if npm view "@fqueis/openapi-contract@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is already on npm — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is not on npm — will publish."
          fi

      - name: Lint
        if: steps.version.outputs.already_published == 'false'
        run: pnpm lint

      - name: Test
        if: steps.version.outputs.already_published == 'false'
        run: pnpm test

      - name: Build
        if: steps.version.outputs.already_published == 'false'
        run: pnpm build

      - name: Create GitHub Release
        if: steps.version.outputs.already_published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create."
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -vxF "$TAG" | head -n1 || true)"

          extract_changelog_section() {
            local ver="$1"
            local out="$2"
            if [ ! -f CHANGELOG.md ]; then
              return 1
            fi
            awk -v ver="$ver" '
              BEGIN {
                ver_re = ver
                gsub(/\./, "\\.", ver_re)
              }
              $0 ~ ("^## \\[" ver_re "\\]( |$)") {
                found = 1
                print
                next
              }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$out"
            # Require at least the heading line
            if [ ! -s "$out" ] || ! grep -qF "## [${ver}]" "$out"; then
              return 1
            fi
            return 0
          }

          if extract_changelog_section "$VERSION" "$NOTES_FILE"; then
            echo "Using CHANGELOG.md section for ${VERSION}."
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --target "${{ github.sha }}"
          elif [ -n "$PREV_TAG" ]; then
            echo "No CHANGELOG section for ${VERSION}; generating notes since ${PREV_TAG}."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --notes-start-tag "$PREV_TAG" \
              --target "${{ github.sha }}"
          else
            echo "No CHANGELOG section and no previous v* tag; writing initial stub."
            {
              echo "## ${TAG}"
              echo
              echo "Initial release of \`@fqueis/openapi-contract\`."
            } > "$NOTES_FILE"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --target "${{ github.sha }}"
          fi

      - name: Publish to npm
        if: steps.version.outputs.already_published == 'false'
        run: pnpm publish --access public --no-git-checks
